<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10131a">
<meta name="description" content="GameVault — your personal gaming companion.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css?v=031">
<title>GameVault</title>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <a class="brand" href="#home"><span class="brandmark">GV</span><span>GameVault</span></a>
    <nav>
      <a class="nav active" href="#home">⌂ <span>Home</span></a>
      <a class="nav" href="#games">▣ <span>Games</span></a>
      <a class="nav" href="#tasks">✓ <span>Tasks</span></a>
    </nav>
    <div class="sidebar-foot">GameVault <b>v0.2</b><small>Local prototype</small></div>
  </aside>

  <main>
    <header class="topbar">
      <div><p class="eyebrow">WELCOME BACK</p><h1 id="pageTitle">Home</h1></div>
      <button class="avatar" aria-label="Profile">R</button>
    </header>

    <section id="view"></section>
  </main>

  <button class="fab" id="quickAdd" aria-label="Quick add">＋</button>

  <nav class="mobile-nav">
    <a href="#home" class="mnav active"><span>⌂</span>Home</a>
    <a href="#games" class="mnav"><span>▣</span>Games</a>
    <button id="mobileAdd" class="mobile-add" aria-label="Quick add">＋</button>
    <a href="#tasks" class="mnav"><span>✓</span>Tasks</a>
    <a href="#profile" class="mnav"><span>●</span>Profile</a>
  </nav>
</div>

<dialog id="addDialog">
<form method="dialog" id="addForm">
  <div class="dialog-head"><div><p class="eyebrow">CAPTURE IT</p><h2>Quick Add</h2></div><button value="cancel" class="icon-btn">×</button></div>
  <label>Game<select id="addGame"></select></label>
  <label>Playthrough<select id="addPlay"></select></label>
  <label>Type<select id="addType"><option value="task">Task</option><option value="note">Note</option><option value="resume">Resume point</option><option value="resource">Resource</option></select></label>
  <label>Details<textarea id="addText" rows="4" required maxlength="500" placeholder="What do you want to remember?"></textarea></label>
  <button class="primary" value="default" id="saveAdd">Save</button>
</form>
</dialog>

<dialog id="resourceDialog"><form method="dialog" id="resourceForm"><div class="dialog-head"><div><p class="eyebrow">SAVE A LINK</p><h2>Add Resource</h2></div><button id="resourceClose" class="icon-btn">×</button></div><label>Name<input id="resourceLabel" required maxlength="100"></label><label>URL<input id="resourceUrl" required maxlength="1000"></label><button class="primary" id="resourceSave">Save Resource</button></form></dialog>

<dialog id="manageDialog"><form method="dialog" id="manageForm"><div class="dialog-head"><div><p class="eyebrow">GAMEVAULT</p><h2 id="manageTitle">Edit</h2></div><button id="manageClose" class="icon-btn">×</button></div><label>Name<input id="mName" required maxlength="100"></label><label><span id="mPlatformLabel">Platform</span><input id="mPlatform" maxlength="100"></label><div id="playFields"><label>Resume Here<textarea id="mResume" rows="3" maxlength="500"></textarea></label><label>Current Goal<textarea id="mGoal" rows="3" maxlength="500"></textarea></label></div><div class="manage-actions"><button class="danger" id="manageDelete" type="button" hidden>Delete</button><button class="primary" id="manageSave">Save</button></div></form></dialog>
<script>
(function(){
  function show(msg){
    var box=document.getElementById("startupError");
    if(!box){box=document.createElement("div");box.id="startupError";box.style.cssText="position:fixed;z-index:99999;left:12px;right:12px;top:12px;padding:14px;background:#5b1010;color:white;border:2px solid #ff7b7b;border-radius:10px;font:14px/1.4 monospace;white-space:pre-wrap;overflow-wrap:anywhere";document.body.appendChild(box)}
    box.textContent="GameVault loader diagnostic\n"+msg;
  }
  window.__gvShowError=show;
  window.addEventListener("error",function(e){show("JS error: "+(e.message||"unknown")+" @ "+(e.filename||"unknown")+":"+e.lineno+":"+e.colno)});
  var script=document.createElement("script");
  script.src="app.js?v=031";
  script.onload=function(){setTimeout(function(){if(!document.querySelector("#view").innerHTML.trim())show("app.js loaded, but Home did not render.")},500)};
  script.onerror=function(){show("app.js failed to load: "+script.src)};
  document.body.appendChild(script);
})();
</script>
</body>
</html>
